spring.application.name=food-basket-backend
server.port=8080

# Default DataSource: H2 Database (In-Memory with MySQL Compatibility Mode)
# This allows instant zero-config startup without needing a running local MySQL service!
spring.datasource.url=jdbc:h2:mem:food_basket_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable SQL Initialization Seed Data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
